name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Brings the latest Gloom release as the gloomberb devDependency, so this
      # checks the plugin against what users run, exactly as a fresh clone does.
      - run: bun install

      - run: bun run typecheck
      - run: bun test
